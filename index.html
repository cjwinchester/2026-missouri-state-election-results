<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missouri Primary Election Results — August 4, 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* Colorblind-safe (Okabe–Ito based) party colors */
  .bar-republican { background-color: #D55E00; }
  .bar-democratic { background-color: #0072B2; }
  .bar-libertarian { background-color: #E69F00; }
  .bar-yes { background-color: #009E73; }
  .bar-no { background-color: #767676; }
  .bar-other { background-color: #CC79A7; }

  .dot-republican { background-color: #D55E00; }
  .dot-democratic { background-color: #0072B2; }
  .dot-libertarian { background-color: #E69F00; }
  .dot-yes { background-color: #009E73; }
  .dot-no { background-color: #767676; }
  .dot-other { background-color: #CC79A7; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <header class="bg-slate-900 text-white">
    <div class="max-w-4xl mx-auto px-4 py-6">
      <h1 class="text-2xl sm:text-3xl font-bold">Missouri Primary Election Results</h1>
      <p class="text-slate-300 mt-1">August 4, 2026 — unofficial results</p>
      <p id="updated" class="text-sm text-slate-400 mt-3">Loading…</p>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6">

    <div class="sticky top-0 z-10 bg-slate-50/95 backdrop-blur pb-4 pt-1 -mt-1">
      <div id="source-toggle" class="flex gap-2 mb-3" role="tablist" aria-label="Results source"></div>

      <label for="search" class="sr-only">Search races or candidates</label>
      <input
        id="search"
        type="search"
        placeholder="Search by office or candidate name…"
        class="w-full rounded-lg border border-slate-300 px-4 py-3 text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-slate-500"
        autocomplete="off"
      >
      <p id="result-count" class="text-sm text-slate-500 mt-2"></p>
    </div>

    <div class="mb-4 flex flex-wrap gap-4 text-sm text-slate-600">
      <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full dot-republican inline-block"></span> Republican</span>
      <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full dot-democratic inline-block"></span> Democratic</span>
      <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full dot-libertarian inline-block"></span> Libertarian</span>
      <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full dot-yes inline-block"></span> Yes / For</span>
      <span class="inline-flex items-center gap-1.5"><span class="w-3 h-3 rounded-full dot-no inline-block"></span> No / Against</span>
    </div>

    <div id="races" class="space-y-4"></div>

    <p id="empty-state" class="hidden text-center text-slate-500 py-12">No races or candidates match your search.</p>
    <p id="error-state" class="hidden text-center text-red-600 py-12"></p>

  </main>

  <footer class="max-w-4xl mx-auto px-4 py-8 text-sm text-slate-400">
    Source: <a class="font-bold underline" href="https://enr.sos.mo.gov/">Missouri Secretary of State</a>, <a class="font-bold underline" href="https://www.boonemo.gov/clerk/elections/results/unofficial.asp">Boone County Clerk</a> | <a class="font-bold underline" href="https://github.com/cjwinchester/2026-missouri-state-election-results">Built with Claude</a>
  </footer>

<script>
const PARTY_KEY = {
  "Republican": "republican",
  "Democratic": "democratic",
  "Libertarian": "libertarian",
};

function partyClass(party, candidateName) {
  const key = PARTY_KEY[party];
  if (key) return key;
  // Ballot measures use an empty-string party key; color by Yes/No.
  const name = (candidateName || "").trim().toUpperCase();
  if (name === "YES") return "yes";
  if (name === "NO") return "no";
  return "other";
}

function partyLabel(party) {
  return party && party.trim() ? party : "Ballot Measure";
}

function pctToNumber(pct) {
  const n = parseFloat(String(pct).replace("%", ""));
  return Number.isFinite(n) ? n : 0;
}

function fmtVotes(n) {
  return Number(n).toLocaleString("en-US");
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function candidateRow(candidate, party) {
  const cls = partyClass(party, candidate.name);
  const pct = pctToNumber(candidate.vote_pct);
  const widthPct = Math.max(pct, pct > 0 ? 1.5 : 0); // keep tiny slivers visible
  return `
    <div class="py-1.5">
      <div class="flex items-baseline justify-between gap-3 text-sm">
        <span class="font-medium text-slate-800 truncate">${escapeHtml(candidate.name)}</span>
        <span class="text-slate-500 whitespace-nowrap tabular-nums">
          ${fmtVotes(candidate.votes)} votes &middot; ${escapeHtml(candidate.vote_pct)}
        </span>
      </div>
      <div class="mt-1 h-2.5 rounded-full bg-slate-200 overflow-hidden" role="img"
           aria-label="${escapeHtml(candidate.name)}: ${escapeHtml(candidate.vote_pct)} of votes">
        <div class="h-full rounded-full bar-${cls}" style="width: ${widthPct}%"></div>
      </div>
    </div>
  `;
}

function partyGroup(party, candidates) {
  const rows = candidates.map(c => candidateRow(c, party)).join("");
  return `
    <div class="mt-3 first:mt-0">
      <h3 class="text-xs font-semibold uppercase tracking-wide text-slate-400 mb-1">${escapeHtml(partyLabel(party))}</h3>
      ${rows}
    </div>
  `;
}

function raceCard(race) {
  const reported = race.precincts?.reported ?? 0;
  const total = race.precincts?.total ?? 0;
  const precinctPct = total > 0 ? Math.round((reported / total) * 1000) / 10 : 0;
  const watched = !!race.race_to_watch;

  const partyOrder = ["Republican", "Democratic", "Libertarian"];
  const parties = Object.keys(race.candidates || {});
  parties.sort((a, b) => {
    const ai = partyOrder.indexOf(a);
    const bi = partyOrder.indexOf(b);
    if (ai === -1 && bi === -1) return a.localeCompare(b);
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });

  const groups = parties.map(p => partyGroup(p, race.candidates[p])).join("");

  const cardClasses = watched
    ? "bg-amber-50 rounded-xl shadow-sm border-2 border-amber-300 p-4 sm:p-5"
    : "bg-white rounded-xl shadow-sm border border-slate-200 p-4 sm:p-5";

  return `
    <article class="race-card ${cardClasses}" data-search="${escapeHtml(raceSearchText(race))}" data-watched="${watched}">
      <div class="flex items-start justify-between gap-3 flex-wrap">
        <h2 class="text-lg font-semibold text-slate-900 flex items-center gap-2">
          ${watched ? '<span class="text-amber-500" aria-hidden="true">★</span>' : ''}
          ${escapeHtml(race.office)}
        </h2>
        <span class="text-xs text-slate-500 whitespace-nowrap mt-1">
          ${fmtVotes(reported)} of ${fmtVotes(total)} precincts (${precinctPct}%)
        </span>
      </div>
      <div class="mt-1.5 h-1.5 rounded-full bg-slate-100 overflow-hidden">
        <div class="h-full rounded-full bg-slate-400" style="width: ${precinctPct}%"></div>
      </div>
      ${groups}
    </article>
  `;
}

function raceSearchText(race) {
  const names = [];
  for (const party of Object.keys(race.candidates || {})) {
    names.push(party);
    for (const c of race.candidates[party]) names.push(c.name);
  }
  return `${race.office} ${names.join(" ")}`.toLowerCase();
}

function renderToggle(sources, activeKey, onSelect) {
  const toggleEl = document.getElementById("source-toggle");
  toggleEl.innerHTML = Object.keys(sources).map(key => {
    const active = key === activeKey;
    const activeClasses = "bg-slate-900 text-white";
    const inactiveClasses = "bg-white text-slate-600 border border-slate-300 hover:bg-slate-100";
    return `
      <button
        type="button"
        data-source-key="${escapeHtml(key)}"
        role="tab"
        aria-selected="${active}"
        class="px-4 py-2 rounded-lg text-sm font-medium transition-colors ${active ? activeClasses : inactiveClasses}"
      >${escapeHtml(sources[key].label || key)}</button>
    `;
  }).join("");

  toggleEl.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => onSelect(btn.dataset.sourceKey));
  });
}

async function init() {
  const racesEl = document.getElementById("races");
  const updatedEl = document.getElementById("updated");
  const searchEl = document.getElementById("search");
  const emptyEl = document.getElementById("empty-state");
  const errorEl = document.getElementById("error-state");
  const countEl = document.getElementById("result-count");

  let payload;

  try {
    const res = await fetch("./2026-08-04-missouri-election-results.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    payload = await res.json();
  } catch (err) {
    errorEl.textContent = `Couldn't load results data: ${err.message}`;
    errorEl.classList.remove("hidden");
    updatedEl.textContent = "";
    return;
  }

  const sources = payload.sources || {};
  const sourceKeys = Object.keys(sources);

  if (sourceKeys.length === 0) {
    errorEl.textContent = "No results sources found in the data file.";
    errorEl.classList.remove("hidden");
    return;
  }

  updatedEl.textContent = payload.updated
    ? `Data last updated: ${new Date(payload.updated).toLocaleString("en-US")}`
    : "";

  let activeKey = sourceKeys[0];
  let cards = [];

  function applyFilter() {
    const q = searchEl.value.trim().toLowerCase();
    let visible = 0;
    for (const card of cards) {
      const match = !q || card.dataset.search.includes(q);
      card.classList.toggle("hidden", !match);
      if (match) visible++;
    }
    emptyEl.classList.toggle("hidden", visible !== 0);
    countEl.textContent = q ? `${visible} of ${cards.length} races` : `${cards.length} races`;
  }

  function renderSource(key) {
    activeKey = key;
    const races = sources[key].races || [];

    const watched = races.filter(r => r.race_to_watch);
    const rest = races.filter(r => !r.race_to_watch);

    const watchedHtml = watched.length
      ? `
        <div class="mb-6">
          <h2 class="text-sm font-bold uppercase tracking-wide text-amber-700 mb-2 flex items-center gap-1.5">
            <span aria-hidden="true">★</span> Races to Watch
          </h2>
          <div class="space-y-4">${watched.map(raceCard).join("")}</div>
        </div>
      `
      : "";

    const restHtml = rest.map(raceCard).join("");

    racesEl.innerHTML = races.length ? `${watchedHtml}<div class="space-y-4">${restHtml}</div>` : "";
    cards = Array.from(document.querySelectorAll(".race-card"));
    renderToggle(sources, activeKey, renderSource);

    if (races.length === 0) {
      emptyEl.textContent = "No results posted for this source yet.";
      emptyEl.classList.remove("hidden");
      countEl.textContent = "0 races";
    } else {
      emptyEl.textContent = "No races or candidates match your search.";
      applyFilter();
    }
  }

  searchEl.addEventListener("input", applyFilter);
  renderSource(activeKey);
}

init();
</script>
</body>
</html>
